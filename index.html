<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transporte Rachi e Hijos</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --azul:#142f5b;
  --azul2:#1d4678;
  --dorado:#d9a900;
  --oliva:#8a862c;
  --fondo:#eef2f7;
  --blanco:#fff;
  --texto:#10203a;
  --gris:#68758a;
  --verde:#168754;
  --rojo:#d83434;
  --borde:#dce3ec;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--texto)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{
  background:linear-gradient(135deg,var(--azul),var(--azul2));
  color:white;
  padding:20px 24px;
}
.brand{font-size:29px;font-weight:900}
.brand span{color:var(--dorado);font-size:13px}
.sub{margin-top:5px;color:#d6dfec}
.userbar{margin-top:12px;font-size:14px;color:#e7edf6}

nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
nav button{
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);
  color:white;padding:10px 16px;border-radius:14px
}
nav button.active{background:var(--dorado);color:#09152a;font-weight:bold}

main{max-width:1080px;margin:auto;padding:28px 20px 80px}
.page{display:none}
.page.active{display:block}
h1{margin-top:0}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{
  background:white;border:1px solid var(--borde);
  border-radius:20px;padding:20px;
  box-shadow:0 6px 18px rgba(20,47,91,.05)
}
.metric span{display:block;color:var(--gris)}
.metric strong{display:block;font-size:38px;margin-top:10px}

.toolbar{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:16px;flex-wrap:wrap
}
.primary{
  background:var(--azul);color:white;border:0;
  padding:11px 16px;border-radius:12px;font-weight:bold
}
.secondary{
  background:white;color:var(--azul);border:1px solid var(--borde);
  padding:10px 14px;border-radius:12px
}
.danger{background:var(--rojo);color:white;border:0;padding:9px 13px;border-radius:10px}

.row{
  background:white;border:1px solid var(--borde);
  border-radius:17px;padding:16px;margin:10px 0
}
.row strong{font-size:17px}
.muted{color:var(--gris);font-size:14px}
.badge{
  display:inline-block;padding:5px 9px;border-radius:999px;
  background:#fff0b3;font-size:12px;font-weight:bold
}
.badge.confirmado{background:#d9e8ff;color:#1451a3}
.badge.en_viaje{background:#d6f5e4;color:#087541}
.badge.finalizado{background:#e2e7ee;color:#4c5969}

form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:13px;font-weight:bold}
label span{display:block;margin-bottom:5px}
input,select,textarea{
  width:100%;padding:11px;border:1px solid #ccd5e1;border-radius:10px;background:white
}
.full{grid-column:1/-1}
textarea{min-height:80px}
.empty{padding:28px;text-align:center;color:var(--gris)}

#login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(135deg,#102b54,#1d4678)
}
.loginbox{
  width:min(430px,100%);background:white;border-radius:24px;
  padding:30px;box-shadow:0 18px 50px rgba(0,0,0,.25)
}
.loginlogo{font-size:28px;font-weight:900;color:var(--azul)}
.loginlogo span{color:var(--dorado)}
.loginbox input{margin-top:6px;margin-bottom:14px}
.loginbox button{width:100%;margin-top:8px}
#error{color:var(--rojo);margin-top:14px;font-size:14px}

#app{display:none}

@media(max-width:750px){
  .grid{grid-template-columns:1fr 1fr}
  form{grid-template-columns:1fr}
  .full{grid-column:auto}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<section id="login">
  <div class="loginbox">
    <div class="loginlogo">TRANSPORTE RACHI <span>V3</span></div>
    <p class="muted">Sistema de gestión operativa</p>

    <label>Correo electrónico</label>
    <input id="email" type="email" placeholder="usuario@correo.com">

    <label>Contraseña</label>
    <input id="password" type="password" placeholder="••••••••">

    <button class="primary" onclick="login()">INGRESAR</button>
    <div id="error"></div>
  </div>
</section>

<div id="app">
<header>
  <div class="brand">TRANSPORTE RACHI E HIJOS <span>V3</span></div>
  <div class="sub">Sistema de gestión operativa</div>
  <div class="userbar" id="usuarioActual"></div>

  <nav>
    <button class="active" onclick="showPage('panel',this)">Panel</button>
    <button onclick="showPage('viajes',this)">Viajes</button>
    <button onclick="showPage('flota',this)">Flota</button>
    <button onclick="showPage('clientes',this)">Clientes</button>
    <button onclick="logout()">Salir</button>
  </nav>
</header>

<main>

<section id="panel" class="page active">
  <h1>Centro de operaciones</h1>

  <div class="grid">
    <div class="card metric"><span>Viajes</span><strong id="mViajes">0</strong></div>
    <div class="card metric"><span>Unidades activas</span><strong id="mFlota">0</strong></div>
    <div class="card metric"><span>Choferes activos</span><strong id="mChoferes">0</strong></div>
    <div class="card metric"><span>Pendientes</span><strong id="mPendientes">0</strong></div>
  </div>

  <h2 style="margin-top:30px">Próximos viajes</h2>
  <div id="proximos"></div>
</section>

<section id="viajes" class="page">
  <div class="toolbar">
    <h1>Viajes</h1>
    <button class="primary" onclick="toggleForm()">+ Nuevo viaje</button>
  </div>

  <div id="nuevoViaje" class="card" style="display:none;margin-bottom:20px">
    <h2>Nuevo viaje</h2>

    <form id="tripForm">
      <label>
        <span>Fecha</span>
        <input id="fecha" type="date" required>
      </label>

      <label>
        <span>Hora</span>
        <input id="hora" type="time" required>
      </label>

      <label>
        <span>Cliente</span>
        <select id="cliente" required></select>
      </label>

      <label>
        <span>Pasajeros</span>
        <input id="pasajeros" type="number" min="1" value="1" required>
      </label>

      <label>
        <span>Origen</span>
        <input id="origen" required>
      </label>

      <label>
        <span>Destino</span>
        <input id="destino" required>
      </label>

      <label>
        <span>Chofer</span>
        <select id="chofer"></select>
      </label>

      <label>
        <span>Vehículo</span>
        <select id="vehiculo"></select>
      </label>

      <label class="full">
        <span>Observaciones</span>
        <textarea id="observaciones"></textarea>
      </label>

      <div class="full">
        <button class="primary" type="submit">Guardar viaje</button>
        <button class="secondary" type="button" onclick="toggleForm()">Cancelar</button>
      </div>
    </form>
  </div>

  <div id="listaViajes"></div>
</section>

<section id="flota" class="page">
  <h1>Flota</h1>
  <div id="listaFlota"></div>

  <h2 style="margin-top:30px">Choferes</h2>
  <div id="listaChoferes"></div>
</section>

<section id="clientes" class="page">
  <h1>Clientes</h1>
  <div id="listaClientes"></div>
</section>

</main>
</div>

<script>
const SUPABASE_URL = 'https://lfwrujvuliimbpehftf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r5eZRfZu7oVyB9hC6Aiz9w_c_Ne_idL';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let viajes=[];
let vehiculos=[];
let choferes=[];
let clientes=[];
let perfil=null;

async function login(){
  error.textContent='';

  const {data, error:err}=await sb.auth.signInWithPassword({
    email:email.value.trim(),
    password:password.value
  });

  if(err){
    error.textContent='Correo o contraseña incorrectos.';
    return;
  }

  await iniciar(data.user);
}

async function iniciar(user){
  const {data:p,error:e}=await sb
    .from('perfiles')
    .select('*')
    .eq('auth_user_id',user.id)
    .single();

  if(e || !p){
    await sb.auth.signOut();
    error.textContent='Este usuario no tiene un perfil autorizado.';
    return;
  }

  perfil=p;

  login.style.display='none';
  app.style.display='block';

  usuarioActual.textContent =
    perfil.nombre+' · '+perfil.rol.toUpperCase();

  await cargarDatos();
}

async function cargarDatos(){
  const [v,c,f,cl]=await Promise.all([
    sb.from('viajes').select('*').order('fecha',{ascending:true}).order('hora',{ascending:true}),
    sb.from('choferes').select('*').order('nombre'),
    sb.from('vehiculos').select('*').order('vehiculo'),
    sb.from('clientes').select('*').order('nombre')
  ]);

  viajes=v.data||[];
  choferes=c.data||[];
  vehiculos=f.data||[];
  clientes=cl.data||[];

  rellenarSelects();
  render();
}

function rellenarSelects(){
  cliente.innerHTML =
    '<option value="">Seleccionar...</option>'+
    clientes.map(x=>`<option value="${x.id}">${x.nombre}</option>`).join('');

  chofer.innerHTML =
    '<option value="">Sin asignar</option>'+
    choferes.map(x=>`<option value="${x.id}">${x.nombre}</option>`).join('');

  vehiculo.innerHTML =
    '<option value="">Sin asignar</option>'+
    vehiculos.map(x=>`<option value="${x.id}">${x.vehiculo} · ${x.patente}</option>`).join('');
}

function nombreCliente(id){
  return clientes.find(x=>x.id===id)?.nombre||'Sin cliente';
}
function nombreChofer(id){
  return choferes.find(x=>x.id===id)?.nombre||'Sin asignar';
}
function nombreVehiculo(id){
  const x=vehiculos.find(v=>v.id===id);
  return x ? `${x.vehiculo} · ${x.patente}` : 'Sin asignar';
}

function render(){
  mViajes.textContent=viajes.length;
  mFlota.textContent=vehiculos.filter(x=>x.activo).length;
  mChoferes.textContent=choferes.filter(x=>x.activo).length;
  mPendientes.textContent=viajes.filter(x=>x.estado==='pendiente').length;

  proximos.innerHTML=viajes.length
    ? viajes.slice(0,5).map(cardViaje).join('')
    : '<div class="card empty">Todavía no hay viajes cargados.</div>';

  listaViajes.innerHTML=viajes.length
    ? viajes.map(cardViaje).join('')
    : '<div class="card empty">Todavía no hay viajes cargados.</div>';

  listaFlota.innerHTML=vehiculos.map(v=>`
    <div class="row">
      <strong>${v.vehiculo}</strong>
      <div>${v.patente}</div>
      <div class="muted">Año ${v.anio} · Capacidad ${v.capacidad} pasajeros</div>
    </div>
  `).join('');

  listaChoferes.innerHTML=choferes.map(c=>`
    <div class="row">
      <strong>${c.nombre}</strong>
      <div class="muted">${c.telefono||''}</div>
    </div>
  `).join('');

  listaClientes.innerHTML=clientes.map(c=>`
    <div class="row"><strong>${c.nombre}</strong></div>
  `).join('');
}

function cardViaje(v){
  return `
    <div class="row">
      <div class="toolbar">
        <div>
          <strong>${v.fecha} · ${String(v.hora).slice(0,5)} · ${nombreCliente(v.cliente_id)}</strong>
          <div>${v.origen} → ${v.destino}</div>
          <div class="muted">
            ${v.pasajeros} pasajeros · ${nombreChofer(v.chofer_id)}<br>
            ${nombreVehiculo(v.vehiculo_id)}
          </div>
        </div>
        <span class="badge ${v.estado}">${v.estado.replace('_',' ')}</span>
      </div>
    </div>
  `;
}

function toggleForm(){
  nuevoViaje.style.display =
    nuevoViaje.style.display==='none' ? 'block' : 'none';
}

tripForm.addEventListener('submit',async e=>{
  e.preventDefault();

  const nuevo={
    fecha:fecha.value,
    hora:hora.value,
    cliente_id:cliente.value||null,
    origen:origen.value.trim(),
    destino:destino.value.trim(),
    pasajeros:Number(pasajeros.value),
    chofer_id:chofer.value||null,
    vehiculo_id:vehiculo.value||null,
    observaciones:observaciones.value.trim()||null,
    estado:'pendiente'
  };

  const {error}=await sb.from('viajes').insert(nuevo);

  if(error){
    alert('No se pudo guardar el viaje: '+error.message);
    return;
  }

  tripForm.reset();
  pasajeros.value=1;
  toggleForm();
  await cargarDatos();
});

function showPage(id,btn){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session) await iniciar(data.session.user);
})();
</script>

</body>
</html>
